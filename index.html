<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,300&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html {
            scroll-behavior: smooth
        }

        body {
            background: #f8f7f4;
            color: #1c1c1e;
            font-family: 'Nunito', sans-serif;
            overflow-x: hidden;
            cursor: none
        }

        #cursor {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #1c1c1e;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width .18s, height .18s, background .18s
        }

        #cursor.big {
            width: 34px;
            height: 34px;
            background: transparent;
            border: 1.5px solid #1c1c1e
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 48px;
            height: 54px;
            background: rgba(248, 247, 244, .9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid #ebebeb
        }

        .nbrand {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: -.01em
        }

        .nbrand em {
            font-style: italic;
            font-weight: 300;
            color: #999
        }

        .nright {
            display: flex;
            align-items: center;
            gap: 32px
        }

        .nlinks {
            display: flex;
            gap: 24px
        }

        .nlinks a {
            font-size: 12px;
            font-weight: 600;
            color: #999;
            text-decoration: none;
            letter-spacing: .04em;
            transition: color .2s
        }

        .nlinks a:hover {
            color: #1c1c1e
        }

        .lsw {
            display: flex;
            border: 1px solid #ddd;
            border-radius: 4px;
            overflow: hidden
        }

        .lb {
            padding: 4px 10px;
            font-size: 10px;
            font-weight: 800;
            background: none;
            color: #bbb;
            border: none;
            cursor: none;
            font-family: 'Nunito', sans-serif;
            letter-spacing: .08em;
            transition: all .2s
        }

        .lb.on {
            background: #1c1c1e;
            color: #f8f7f4
        }

        #hero {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding-top: 54px;
            position: relative;
            overflow: hidden
        }

        .hero-l {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 48px
        }

        .hero-num {
            font-size: 11px;
            font-weight: 700;
            color: #bbb;
            letter-spacing: .2em;
            margin-bottom: 24px
        }

        .hero-name {
            font-size: clamp(52px, 6.5vw, 88px);
            font-weight: 900;
            line-height: .92;
            letter-spacing: -.04em;
            margin-bottom: 6px
        }

        .hero-name .it {
            font-style: italic;
            font-weight: 300;
            font-size: .82em;
            color: #999;
            display: block;
            margin-top: 2px
        }

        .hero-role {
            font-size: 12px;
            font-weight: 700;
            color: #aaa;
            letter-spacing: .1em;
            text-transform: uppercase;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 10px
        }

        .hero-role::before {
            content: '';
            display: block;
            width: 20px;
            height: 1px;
            background: #ccc
        }

        .hero-desc {
            font-size: 14px;
            line-height: 1.8;
            color: #666;
            max-width: 360px;
            margin-bottom: 36px
        }

        .hero-btns {
            display: flex;
            gap: 10px
        }

        .btn-f {
            padding: 11px 24px;
            background: #1c1c1e;
            color: #f8f7f4;
            font-size: 12px;
            font-weight: 800;
            font-family: 'Nunito', sans-serif;
            border: none;
            border-radius: 3px;
            cursor: none;
            letter-spacing: .06em;
            text-transform: uppercase;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: opacity .2s
        }

        .btn-f:hover {
            opacity: .8
        }

        .btn-o {
            padding: 11px 24px;
            background: none;
            color: #1c1c1e;
            font-size: 12px;
            font-weight: 800;
            font-family: 'Nunito', sans-serif;
            border: 1.5px solid #ddd;
            border-radius: 3px;
            cursor: none;
            letter-spacing: .06em;
            text-transform: uppercase;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: border-color .2s
        }

        .btn-o:hover {
            border-color: #1c1c1e
        }

        .hero-r {
            position: relative;
            background: #f0eeea;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden
        }

        .scroll-hint {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 700;
            color: #ccc;
            letter-spacing: .15em;
            text-transform: uppercase;
            margin-top: 44px;
            animation: bob 2.5s ease-in-out infinite
        }

        .scroll-hint::before {
            content: '↓';
            font-size: 13px;
            font-weight: 300
        }

        @keyframes bob {

            0%,
            100% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(4px)
            }
        }

        .divline {
            height: 1px;
            background: #e8e6e1;
            margin: 0 48px
        }

        #about {
            padding: 60px 48px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center
        }

        .lbl {
            font-size: 11px;
            font-weight: 700;
            color: #bbb;
            letter-spacing: .2em;
            text-transform: uppercase;
            margin-bottom: 14px
        }

        .sec-h {
            font-size: clamp(28px, 3.5vw, 44px);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -.03em;
            margin-bottom: 20px
        }

        .sec-h i {
            font-weight: 300;
            font-style: italic;
            color: #999
        }

        .about-p {
            font-size: 14px;
            line-height: 1.8;
            color: #666;
            max-width: 400px
        }

        .about-p+.about-p {
            margin-top: 12px
        }

        .skills-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px
        }

        .sk {
            background: #f0eeea;
            padding: 18px 16px;
            transition: background .22s
        }

        .sk:hover {
            background: #e8e6e1
        }

        .sk-n {
            font-size: 13px;
            font-weight: 700;
            color: #1c1c1e;
            margin-bottom: 4px
        }

        .sk-t {
            font-size: 11px;
            color: #aaa;
            font-weight: 500
        }

        #services {
            padding: 60px 48px;
            background: #1c1c1e
        }

        #services .lbl {
            color: #555
        }

        #services .sec-h {
            color: #f8f7f4;
            margin-bottom: 40px
        }

        #services .sec-h i {
            color: #555
        }

        .srv-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            border-top: 1px solid #2a2a2c
        }

        .sc {
            padding: 28px 22px;
            border-right: 1px solid #2a2a2c;
            border-bottom: 1px solid #2a2a2c;
            transition: background .22s
        }

        .sc:nth-child(3n) {
            border-right: none
        }

        .sc:hover {
            background: #242426
        }

        .sc-n {
            font-size: 11px;
            font-weight: 700;
            color: #444;
            letter-spacing: .15em;
            margin-bottom: 12px
        }

        .sc-t {
            font-size: 15px;
            font-weight: 700;
            color: #f0eeea;
            margin-bottom: 8px
        }

        .sc-d {
            font-size: 12px;
            color: #666;
            line-height: 1.6
        }

        .sc-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 12px
        }

        .stg {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border: 1px solid #333;
            color: #555;
            border-radius: 2px;
            letter-spacing: .04em
        }

        #projects {
            padding: 60px 48px
        }

        .proj-hd {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 40px
        }

        .proj-hd .sec-h {
            margin-bottom: 0
        }

        .proj-note {
            font-size: 12px;
            color: #bbb;
            font-weight: 600;
            padding-bottom: 3px
        }

        .pgrid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px
        }

        .pc {
            background: #f0eeea;
            overflow: hidden;
            cursor: none;
            transition: background .25s;
            display: flex;
            flex-direction: column
        }

        .pc:hover {
            background: #e8e6e1
        }

        .pc-vis {
            height: 200px;
            padding: 18px 18px 0;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid #e8e6e1
        }

        .pc-body {
            padding: 18px 16px;
            display: flex;
            flex-direction: column;
            flex: 1
        }

        .pc-type {
            font-size: 10px;
            font-weight: 700;
            color: #aaa;
            letter-spacing: .18em;
            text-transform: uppercase;
            margin-bottom: 6px
        }

        .pc-title {
            font-size: 15px;
            font-weight: 800;
            color: #1c1c1e;
            margin-bottom: 6px;
            letter-spacing: -.02em
        }

        .pc-desc {
            font-size: 12px;
            color: #777;
            line-height: 1.6;
            margin-bottom: 10px;
            flex: 1
        }

        .pc-stack {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            margin-bottom: 12px
        }

        .ps {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            background: #e4e2dd;
            color: #777;
            border-radius: 2px
        }

        .pc-link {
            font-size: 12px;
            font-weight: 800;
            color: #1c1c1e;
            text-decoration: none;
            letter-spacing: .03em;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: gap .18s
        }

        .pc-link:hover {
            gap: 8px
        }

        .pc-soon {
            font-size: 11px;
            color: #bbb;
            font-weight: 600
        }

        .live-dot {
            position: absolute;
            top: 28px;
            right: 28px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22c55e;
            animation: lp 2s ease-in-out infinite
        }

        @keyframes lp {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .35
            }
        }

        .pc-frame {
            height: 100%;
            border-radius: 9px 9px 0 0;
            overflow: hidden;
            background: #fff;
            border: 1px solid rgba(0, 0, 0, .07);
            box-shadow: 0 10px 26px rgba(30, 30, 40, .13);
            transition: transform .4s
        }

        .pc:hover .pc-frame {
            transform: translateY(-6px)
        }

        .pc-bar {
            height: 22px;
            background: #f3f1ec;
            border-bottom: 1px solid #eceae5;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 0 10px
        }

        .pc-bar span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #d6d3cd;
            display: block
        }

        .pc-shot {
            width: 100%;
            height: calc(100% - 22px);
            object-fit: cover;
            object-position: center;
            display: block
        }

        .pm {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(20, 20, 22, .55);
            backdrop-filter: blur(6px)
        }

        .pm.open {
            display: flex
        }

        .pm-box {
            background: #f8f7f4;
            width: 100%;
            max-width: 860px;
            max-height: 88vh;
            overflow: auto;
            border-radius: 8px;
            position: relative;
            display: grid;
            grid-template-columns: 1.05fr 1fr
        }

        .pm-x {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 2;
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, .5);
            color: #fff;
            font-size: 17px;
            font-family: 'Nunito', sans-serif;
            cursor: none;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1
        }

        .pm-shot {
            background: #f0eeea;
            min-height: 260px
        }

        .pm-shot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block
        }

        .pm-info {
            padding: 30px 28px
        }

        .pm-cat {
            font-size: 11px;
            font-weight: 700;
            color: #aaa;
            letter-spacing: .18em;
            text-transform: uppercase;
            margin-bottom: 8px
        }

        .pm-title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -.02em;
            margin-bottom: 12px
        }

        .pm-full {
            font-size: 13.5px;
            line-height: 1.75;
            color: #555;
            margin-bottom: 16px
        }

        .pm-feat {
            list-style: none;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 7px
        }

        .pm-feat li {
            font-size: 12.5px;
            color: #444;
            padding-left: 18px;
            position: relative;
            line-height: 1.5
        }

        .pm-feat li::before {
            content: '\2192';
            position: absolute;
            left: 0;
            color: #bbb;
            font-weight: 700
        }

        .pm-stack {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 22px
        }

        .pm-open {
            cursor: none
        }

        @media(max-width:720px) {
            .pm-box {
                grid-template-columns: 1fr;
                max-height: 92vh
            }

            .pm-shot {
                min-height: 190px;
                max-height: 220px
            }

            .pm-info {
                padding: 22px 20px
            }
        }

        #contact {
            padding: 80px 48px;
            text-align: center;
            background: #f0eeea
        }

        .ct-pre {
            font-size: 11px;
            font-weight: 700;
            color: #bbb;
            letter-spacing: .2em;
            text-transform: uppercase;
            margin-bottom: 16px
        }

        .ct-h {
            font-size: clamp(44px, 6.5vw, 88px);
            font-weight: 900;
            line-height: .9;
            letter-spacing: -.04em;
            margin-bottom: 24px
        }

        .ct-h i {
            font-weight: 300;
            font-style: italic;
            color: #bbb;
            display: block
        }

        .ct-sub {
            font-size: 14px;
            color: #888;
            max-width: 320px;
            margin: 0 auto 36px;
            line-height: 1.7
        }

        .clinks {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap
        }

        .cl {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 10px 18px;
            border: 1.5px solid #ddd;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 700;
            color: #666;
            text-decoration: none;
            letter-spacing: .05em;
            text-transform: uppercase;
            transition: all .22s
        }

        .cl:hover {
            border-color: #1c1c1e;
            color: #1c1c1e
        }

        footer {
            border-top: 1px solid #e8e6e1;
            padding: 16px 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #bbb;
            font-weight: 600;
            letter-spacing: .08em
        }

        .reveal {
            opacity: 0;
            transform: translateY(16px);
            transition: opacity .55s, transform .55s
        }

        .reveal.vis {
            opacity: 1;
            transform: none
        }

        @media(max-width:860px) {
            #hero {
                grid-template-columns: 1fr
            }

            .hero-r {
                display: none
            }

            nav {
                padding: 0 20px
            }

            .nlinks a {
                display: none
            }

            .hero-l {
                padding: 36px 20px
            }

            #about {
                grid-template-columns: 1fr;
                gap: 32px;
                padding: 40px 20px
            }

            #services,
            #projects,
            #contact {
                padding: 40px 20px
            }

            .srv-grid {
                grid-template-columns: 1fr 1fr
            }

            .pgrid {
                grid-template-columns: 1fr
            }

            .divline {
                margin: 0 20px
            }

            .proj-hd {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px
            }

            footer {
                padding: 14px 20px
            }
        }
    </style>
</head>

<body>
    <div id="cursor"></div>

    <nav>
        <div class="nbrand">up1mep <em>/ portfolio</em></div>
        <div class="nright">
            <div class="nlinks">
                <a href="#about" data-t="nav.a"></a>
                <a href="#services" data-t="nav.s"></a>
                <a href="#projects" data-t="nav.p"></a>
                <a href="#contact" data-t="nav.c"></a>
            </div>
            <div class="lsw">
                <button class="lb on" id="bru" onclick="setLang('ru')">RU</button>
                <button class="lb" id="ben" onclick="setLang('en')">EN</button>
            </div>
        </div>
    </nav>

    <section id="hero">
        <div class="hero-l">
            <div class="hero-num" id="htime">00:00:00</div>
            <div class="hero-name">
                <span>up1</span><span style="color:#aaa">mep</span>
                <span class="it" data-t="hero.s"></span>
            </div>
            <div class="hero-role" data-t="hero.role"></div>
            <p class="hero-desc" data-t="hero.desc"></p>
            <div class="hero-btns">
                <a href="#projects" class="btn-f" data-t="hero.c1"></a>
                <a href="#contact" class="btn-o" data-t="hero.c2"></a>
            </div>
            <div class="scroll-hint" data-t="hero.scroll"></div>
        </div>
        <div class="hero-r">
            <canvas id="planetCanvas" style="position:absolute;inset:0;width:100%;height:100%"></canvas>
        </div>
    </section>

    <div class="divline"></div>

    <section id="about">
        <div class="reveal">
            <div class="lbl" data-t="ab.ey"></div>
            <h2 class="sec-h" data-t="ab.h"></h2>
            <p class="about-p" data-t="ab.p1"></p>
            <p class="about-p" data-t="ab.p2"></p>
        </div>
        <div class="reveal" style="transition-delay:.1s">
            <div class="skills-grid">
                <div class="sk">
                    <div class="sk-n" data-t="sk1.n"></div>
                    <div class="sk-t">React · Vue · TS</div>
                </div>
                <div class="sk">
                    <div class="sk-n" data-t="sk2.n"></div>
                    <div class="sk-t">Figma · Systems</div>
                </div>
                <div class="sk">
                    <div class="sk-n" data-t="sk3.n"></div>
                    <div class="sk-t">Python · n8n · Make</div>
                </div>
                <div class="sk">
                    <div class="sk-n" data-t="sk4.n"></div>
                    <div class="sk-t">aiogram · Discord</div>
                </div>
                <div class="sk">
                    <div class="sk-n" data-t="sk5.n"></div>
                    <div class="sk-t">Playwright · BS4</div>
                </div>
                <div class="sk">
                    <div class="sk-n" data-t="sk6.n"></div>
                    <div class="sk-t">REST · Webhooks</div>
                </div>
            </div>
        </div>
    </section>

    <div class="divline"></div>

    <section id="services">
        <div class="lbl" data-t="srv.ey"></div>
        <h2 class="sec-h" data-t="srv.h"></h2>
        <div class="srv-grid">
            <div class="sc reveal">
                <div class="sc-n">01</div>
                <div class="sc-t" data-t="s1.t"></div>
                <p class="sc-d" data-t="s1.d"></p>
                <div class="sc-tags"><span class="stg">React</span><span class="stg">Vue</span><span
                        class="stg">TS</span></div>
            </div>
            <div class="sc reveal" style="transition-delay:.06s">
                <div class="sc-n">02</div>
                <div class="sc-t" data-t="s2.t"></div>
                <p class="sc-d" data-t="s2.d"></p>
                <div class="sc-tags"><span class="stg">Figma</span><span class="stg">UX</span></div>
            </div>
            <div class="sc reveal" style="transition-delay:.12s">
                <div class="sc-n">03</div>
                <div class="sc-t" data-t="s3.t"></div>
                <p class="sc-d" data-t="s3.d"></p>
                <div class="sc-tags"><span class="stg">Python</span><span class="stg">n8n</span></div>
            </div>
            <div class="sc reveal" style="transition-delay:.06s">
                <div class="sc-n">04</div>
                <div class="sc-t" data-t="s4.t"></div>
                <p class="sc-d" data-t="s4.d"></p>
                <div class="sc-tags"><span class="stg">TG API</span><span class="stg">aiogram</span></div>
            </div>
            <div class="sc reveal" style="transition-delay:.12s">

        function renderProjects() {
            const g = document.getElementById('pgrid');
            g.innerHTML = PROJECTS.map((p, i) =>
                '<div class="pc reveal" data-p="' + i + '" style="transition-delay:' + ((i % 3) * 0.08) + 's">' +
                '<div class="pc-vis" style="background:' + p.bg + '">' +
                (p.live ? '<div class="live-dot"></div>' : '') +
                '<div class="pc-frame"><div class="pc-bar"><span></span><span></span><span></span></div>' +
                '<img class="pc-shot" src="' + p.shot + '" alt="' + p.title + '" loading="lazy" /></div>' +
                '</div>' +
                '<div class="pc-body">' +
                '<div class="pc-type" data-cat></div>' +
                '<div class="pc-title">' + p.title + '</div>' +
                '<p class="pc-desc" data-short></p>' +
                '<div class="pc-stack">' + p.stack.map(s => '<span class="ps">' + s + '</span>').join('') + '</div>' +
                '<span class="pc-link" data-more></span>' +
                '</div>' +
                '</div>').join('');
            g.querySelectorAll('.pc').forEach(c => c.addEventListener('click', () => openModal(+c.dataset.p)));
        }

        function fillCards(l) {
            document.querySelectorAll('#pgrid .pc').forEach(c => {
                const p = PROJECTS[+c.dataset.p];
                c.querySelector('[data-cat]').textContent = p.cat[l];
                c.querySelector('[data-short]').textContent = p.short[l];
                c.querySelector('[data-more]').textContent = (l === 'ru' ? 'Подробнее →' : 'Details →');
            });
        }

        let modalIdx = null;
        function fillModal(i, l) {
            const p = PROJECTS[i], q = document.getElementById('pmodal');
            const img = q.querySelector('.pm-shot img');
            img.src = p.shot; img.alt = p.title;
            q.querySelector('.pm-cat').textContent = p.cat[l];
            q.querySelector('.pm-title').textContent = p.title;
            q.querySelector('.pm-full').textContent = p.full[l];
            q.querySelector('.pm-feat').innerHTML = p.feat[l].map(f => '<li>' + f + '</li>').join('');
            q.querySelector('.pm-stack').innerHTML = p.stack.map(s => '<span class="ps">' + s + '</span>').join('');
            const a = q.querySelector('.pm-open');
            a.href = p.url; a.textContent = (l === 'ru' ? 'Открыть сайт ↗' : 'Visit site ↗');
        }
        function openModal(i) {
            modalIdx = i; fillModal(i, lang);
            document.getElementById('pmodal').classList.add('open');
            document.body.style.overflow = 'hidden';
        }
        function closeModal() {
            modalIdx = null;
            document.getElementById('pmodal').classList.remove('open');
            document.body.style.overflow = '';
        }
        function wireModal() {
            const q = document.getElementById('pmodal');
            q.addEventListener('click', e => { if (e.target === q) closeModal(); });
            q.querySelector('.pm-x').addEventListener('click', closeModal);
            document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
        }

        function setLang(l) {
            lang = l;
            document.getElementById('bru').classList.toggle('on', l === 'ru');
            document.getElementById('ben').classList.toggle('on', l === 'en');
            document.querySelectorAll('[data-t]').forEach(el => { const v = T[l][el.dataset.t]; if (v !== undefined) el.innerHTML = v; });
            fillCards(l);
            if (modalIdx !== null) fillModal(modalIdx, l);
        }

        renderProjects();
        wireModal();
        setLang('ru');

        function tick() {
            const n = new Date(), p = v => String(v).padStart(2, '0');
            document.getElementById('htime').textContent = p(n.getHours()) + ':' + p(n.getMinutes()) + ':' + p(n.getSeconds());
            setTimeout(tick, 1000);
        }
        tick();

        const cur = document.getElementById('cursor');
        document.addEventListener('mousemove', e => { cur.style.left = e.clientX + 'px'; cur.style.top = e.clientY + 'px'; });
        document.querySelectorAll('a,button,.pc,.sc,.sk').forEach(el => {
            el.addEventListener('mouseenter', () => cur.classList.add('big'));
            el.addEventListener('mouseleave', () => cur.classList.remove('big'));
        });

        const cv = document.getElementById('planetCanvas');
        function initCanvas() {
            const W = cv.parentElement.offsetWidth || 520;
            const H = cv.parentElement.offsetHeight || 680;
            cv.width = W * 2; cv.height = H * 2;
            const cx = cv.getContext('2d'); cx.scale(2, 2);
            const planets = [
                { x: W * .54, y: H * .4, r: 100, bands: 7, col: '#6d28d9', ring: true, tilt: .28, ox: 10, oy: 7, sp: .00009 },
                { x: W * .8, y: H * .2, r: 32, bands: 4, col: '#b45309', ring: false, tilt: 0, ox: 6, oy: 4, sp: .00016 },
                { x: W * .2, y: H * .72, r: 46, bands: 5, col: '#0891b2', ring: true, tilt: .35, ox: 7, oy: 5, sp: .00012 },
                { x: W * .84, y: H * .76, r: 20, bands: 3, col: '#16a34a', ring: false, tilt: 0, ox: 4, oy: 3, sp: .00022 },
                { x: W * .1, y: H * .22, r: 14, bands: 2, col: '#dc2626', ring: false, tilt: 0, ox: 3, oy: 2, sp: .00027 },
            ];
            const stars = Array.from({ length: 180 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * .8 + .15, a: Math.random() * .45 + .1, ph: Math.random() * Math.PI * 2 }));
            let t = 0;
            function draw() {
                t += .5; cx.clearRect(0, 0, W, H);
                stars.forEach(s => {
                    cx.globalAlpha = s.a * (0.45 + 0.55 * Math.sin(t * .018 + s.ph));
                    cx.fillStyle = '#888'; cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, Math.PI * 2); cx.fill();
                });
                cx.globalAlpha = 1;
                planets.forEach(p => {
                    const px = p.x + Math.sin(t * p.sp * 1000) * p.ox;
                    const py = p.y + Math.cos(t * p.sp * 700) * p.oy;
                    if (p.ring) {
                        cx.save(); cx.translate(px, py); cx.rotate(p.tilt); cx.scale(1, .26);
                        cx.strokeStyle = p.col; cx.globalAlpha = .16; cx.lineWidth = p.r * .22;
                        cx.beginPath(); cx.arc(0, 0, p.r * 1.5, 0, Math.PI * 2); cx.stroke();
                        cx.lineWidth = p.r * .08; cx.globalAlpha = .09;
                        cx.beginPath(); cx.arc(0, 0, p.r * 1.72, 0, Math.PI * 2); cx.stroke();
                        cx.restore();
                    }
                    cx.save(); cx.beginPath(); cx.arc(px, py, p.r, 0, Math.PI * 2); cx.clip();
                    cx.fillStyle = p.col; cx.globalAlpha = .1; cx.fillRect(px - p.r, py - p.r, p.r * 2, p.r * 2);
                    for (let i = 0; i < p.bands; i++) {
                        const by = py - p.r + (2 * p.r * i / p.bands) + p.r / p.bands * .4;
                        cx.fillStyle = p.col; cx.globalAlpha = .05 + (i % 2) * .04;
                        cx.beginPath(); cx.ellipse(px, by, p.r, p.r * .14, 0, 0, Math.PI * 2); cx.fill();
                    }
                    cx.globalAlpha = .07; cx.fillStyle = '#fff';
                    cx.beginPath(); cx.ellipse(px - p.r * .22, py - p.r * .22, p.r * .45, p.r * .35, -.5, 0, Math.PI * 2); cx.fill();
                    cx.restore();
                    cx.strokeStyle = p.col; cx.lineWidth = .8; cx.globalAlpha = .18;
                    cx.beginPath(); cx.arc(px, py, p.r, 0, Math.PI * 2); cx.stroke();
                    cx.globalAlpha = 1;
                });
                requestAnimationFrame(draw);
            }
            draw();
        }
        window.addEventListener('load', initCanvas);

        const obs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) e.target.classList.add('vis') }), { threshold: .07 });
        document.querySelectorAll('.reveal').forEach(r => obs.observe(r));
    </script>
</body>
